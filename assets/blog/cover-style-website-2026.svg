<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="tactileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="10" flood-color="#450D50" flood-opacity="0.18"/>
    </filter>
    <filter id="cardElevation" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#450D50" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="softCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAFD"/>
      <stop offset="100%" stop-color="#F2EDF6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#softCanvas)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#E4DCE9" stroke-width="1" stroke-dasharray="4 6" opacity="0.65">
    <line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Main Tactile Bento Container Frame -->
  <g transform="translate(80, 50)">
    <!-- Backing Outer Board -->
    <rect x="0" y="0" width="640" height="350" rx="12" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1.5" filter="url(#tactileShadow)"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="640" height="46" rx="12" fill="#F5F0F8"/>
    <rect x="0" y="36" width="640" height="10" fill="#F5F0F8"/>
    <line x1="0" y1="46" x2="640" y2="46" stroke="#E4DCE9" stroke-width="1"/>
    
    <!-- Window Control Indicators -->
    <circle cx="26" cy="23" r="5" fill="#D5CCD9"/>
    <circle cx="42" cy="23" r="5" fill="#D5CCD9"/>
    <circle cx="58" cy="23" r="5" fill="#D5CCD9"/>

    <text x="612" y="27" text-anchor="end" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#756A7D" letter-spacing="1.2">WEB VISUAL STYLES · 2026</text>

    <!-- 4 Bento Grid Cards Representing the 4 Styles -->
    <g transform="translate(24, 66)">
      <!-- Quadrant 1: Tactile Minimalism -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="284" height="120" rx="8" fill="#F0EDF4" stroke="#D5CCD9" stroke-width="1.2" filter="url(#cardElevation)"/>
        <rect x="16" y="16" width="36" height="36" rx="6" fill="#211B28"/>
        <circle cx="34" cy="34" r="8" fill="#F0EDF4"/>
        <text x="64" y="32" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#211B28">Tactile Minimalism</text>
        <text x="64" y="48" font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D">Depth · Shadows · Physical Touch</text>
        <!-- Mock Tactile Button Inside -->
        <rect x="16" y="68" width="120" height="34" rx="6" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1" filter="url(#cardElevation)"/>
        <text x="76" y="89" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#211B28">Restrained UI</text>
        <rect x="148" y="76" width="118" height="6" rx="3" fill="#D5CCD9" opacity="0.6"/>
        <rect x="148" y="88" width="80" height="6" rx="3" fill="#D5CCD9" opacity="0.4"/>
      </g>

      <!-- Quadrant 2: Bento Grid Layout -->
      <g transform="translate(308, 0)">
        <rect x="0" y="0" width="284" height="120" rx="8" fill="#F0EDF4" stroke="#D5CCD9" stroke-width="1.2" filter="url(#cardElevation)"/>
        <text x="18" y="30" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#211B28">Bento Grid Structure</text>
        <text x="18" y="46" font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D">Modular · Content Compartments</text>
        <!-- Mini Bento Cells -->
        <g transform="translate(18, 58)">
          <rect x="0" y="0" width="80" height="48" rx="5" fill="#211B28"/>
          <text x="40" y="28" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="14" font-weight="800" fill="#F0EDF4">26</text>
          <rect x="88" y="0" width="158" height="22" rx="5" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1"/>
          <rect x="88" y="26" width="158" height="22" rx="5" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1"/>
        </g>
      </g>

      <!-- Quadrant 3: Editorial Typography -->
      <g transform="translate(0, 136)">
        <rect x="0" y="0" width="284" height="124" rx="8" fill="#F0EDF4" stroke="#D5CCD9" stroke-width="1.2" filter="url(#cardElevation)"/>
        <text x="18" y="32" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#211B28">Editorial Typography</text>
        <text x="18" y="48" font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D">Sharp Contrast · Prose Hierarchy</text>
        <text x="18" y="86" font-family="'Rubik', serif" font-size="28" font-weight="800" fill="#211B28" letter-spacing="-1">Aa Bb Cc</text>
        <text x="18" y="106" font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D" letter-spacing="1">CONTENT-FIRST AESTHETIC</text>
      </g>

      <!-- Quadrant 4: Restrained Brutalism -->
      <g transform="translate(308, 136)">
        <rect x="0" y="0" width="284" height="124" rx="8" fill="#F0EDF4" stroke="#D5CCD9" stroke-width="1.2" filter="url(#cardElevation)"/>
        <text x="18" y="32" font-family="'Rubik', sans-serif" font-size="12" font-weight="700" fill="#211B28">Controlled Brutalism</text>
        <text x="18" y="48" font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D">Direct Lines · Raw Confidence</text>
        <!-- Brutalist Frame -->
        <g transform="translate(18, 62)">
          <rect x="0" y="0" width="248" height="46" rx="2" fill="#FCFAFD" stroke="#211B28" stroke-width="2"/>
          <line x1="124" y1="0" x2="124" y2="46" stroke="#211B28" stroke-width="1.5"/>
          <text x="62" y="27" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="11" font-weight="700" fill="#211B28">MONO</text>
          <text x="186" y="27" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="11" font-weight="700" fill="#211B28">FAST</text>
        </g>
      </g>
    </g>
  </g>
</svg>
