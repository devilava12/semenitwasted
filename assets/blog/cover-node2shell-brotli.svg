<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Node2Shell: buffer delapan byte decoder Brotli yang meluap</title>
  <desc id="coverDesc">Diagram skematis lapisan JavaScript yang meneruskan aliran data Brotli ke decoder C. Buffer internal delapan byte terisi penuh dan tiga byte tambahan tertulis di luar batasnya. Di bawahnya terdapat garis waktu Node.js dari 2009 hingga 2026.</desc>
  <defs>
    <filter id="tactileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="10" flood-color="#450D50" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="softCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAFD"/>
      <stop offset="100%" stop-color="#F2EDF6"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#211B28"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#softCanvas)"/>
  <g stroke="#E4DCE9" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Eyebrow -->
  <text x="48" y="52" font-family="'Rubik', sans-serif" font-size="12" font-weight="600" fill="#756A7D" letter-spacing="1.5">CVE-2026-111497 · OUT-OF-BOUNDS WRITE · NODE.JS 22 / 24 / 26</text>

  <!-- JavaScript layer card -->
  <g transform="translate(48, 82)">
    <rect x="0" y="0" width="230" height="200" rx="10" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1.5" filter="url(#tactileShadow)"/>
    <text x="20" y="34" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#756A7D" letter-spacing="1">LAPISAN JAVASCRIPT</text>
    <text x="20" y="66" font-family="monospace" font-size="13" fill="#211B28">fetch(url)</text>
    <text x="20" y="90" font-family="monospace" font-size="13" fill="#211B28">express.json()</text>
    <text x="20" y="114" font-family="monospace" font-size="13" fill="#211B28">zlib.brotliDecompress()</text>
    <rect x="20" y="138" width="190" height="40" rx="8" fill="#F5F0F8" stroke="#E4DCE9" stroke-width="1"/>
    <text x="115" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#450D50">Content-Encoding: br</text>
  </g>

  <!-- Arrow across the seam -->
  <line x1="290" y1="182" x2="342" y2="182" stroke="#211B28" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="316" y1="92" x2="316" y2="272" stroke="#450D50" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5"/>
  <text x="316" y="294" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="10" font-weight="600" fill="#756A7D" letter-spacing="1">PERBATASAN</text>

  <!-- C decoder card -->
  <g transform="translate(354, 82)">
    <rect x="0" y="0" width="398" height="200" rx="10" fill="#211B28" stroke="#3B3248" stroke-width="1.5" filter="url(#tactileShadow)"/>
    <text x="22" y="34" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#B8AFC0" letter-spacing="1">DECODER BROTLI (C) · deps/brotli</text>
    <text x="22" y="62" font-family="monospace" font-size="12" fill="#D8B5E4">block switch tidak valid  →  "NEEDS_MORE_INPUT"</text>

    <!-- 8-byte buffer -->
    <g transform="translate(22, 90)">
      <rect x="0" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="38" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="76" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="114" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="152" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="190" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="228" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <rect x="266" y="0" width="34" height="40" rx="5" fill="#F0EDF4"/>
      <!-- Overflow bytes -->
      <rect x="306" y="0" width="16" height="40" rx="4" fill="none" stroke="#D8B5E4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="326" y="0" width="16" height="40" rx="4" fill="none" stroke="#D8B5E4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
      <rect x="346" y="0" width="8" height="40" rx="3" fill="none" stroke="#D8B5E4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
      <line x1="303" y1="-8" x2="303" y2="48" stroke="#FFFFFF" stroke-width="2"/>
      <text x="150" y="68" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="11" fill="#B8AFC0">buffer internal: 8 byte</text>
      <text x="330" y="68" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#D8B5E4">di luar batas</text>
    </g>
  </g>

  <!-- Timeline strip -->
  <g transform="translate(48, 330)">
    <rect x="0" y="0" width="704" height="76" rx="10" fill="#F5F0F8" stroke="#E4DCE9" stroke-width="1"/>
    <line x1="40" y1="30" x2="664" y2="30" stroke="#D5CCD9" stroke-width="2"/>
    <g font-family="'Rubik', sans-serif" text-anchor="middle">
      <circle cx="40" cy="30" r="6" fill="#211B28"/>
      <text x="40" y="58" font-size="12" font-weight="700" fill="#211B28">2009</text>
      <circle cx="196" cy="30" r="6" fill="#211B28"/>
      <text x="196" y="58" font-size="12" font-weight="700" fill="#211B28">2015</text>
      <circle cx="352" cy="30" r="6" fill="#211B28"/>
      <text x="352" y="58" font-size="12" font-weight="700" fill="#211B28">2019</text>
      <circle cx="508" cy="30" r="6" fill="#211B28"/>
      <text x="508" y="58" font-size="12" font-weight="700" fill="#211B28">2023</text>
      <circle cx="664" cy="30" r="8" fill="#450D50"/>
      <text x="664" y="58" font-size="12" font-weight="700" fill="#450D50">2026</text>
    </g>
    <g font-family="'Rubik', sans-serif" font-size="10" fill="#756A7D" text-anchor="middle">
      <text x="40" y="18">JSConf EU</text>
      <text x="196" y="18">io.js bergabung</text>
      <text x="352" y="18">Brotli masuk zlib</text>
      <text x="508" y="18">Permission Model</text>
      <text x="664" y="18" font-weight="600" fill="#450D50">Node2Shell</text>
    </g>
  </g>
</svg>
