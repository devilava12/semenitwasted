<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="8" stdDeviation="10" flood-color="#450D50" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAFD"/>
      <stop offset="100%" stop-color="#F2EDF6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#softBg)"/>

  <!-- Subtle Geometric Accents -->
  <g opacity="0.6" stroke="#E4DCE9" stroke-width="1" stroke-dasharray="4 6">
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="680" y1="0" x2="680" y2="450"/>
    <circle cx="400" cy="225" r="180" fill="none"/>
  </g>

  <!-- Central Support & UX Diagnostic Bento -->
  <g transform="translate(140, 70)">
    <!-- Backing Frame -->
    <rect x="0" y="0" width="520" height="310" rx="10" fill="#FCFAFD" stroke="#E4DCE9" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Top Badge Bar -->
    <rect x="0" y="0" width="520" height="46" rx="10" fill="#F5F0F8"/>
    <rect x="0" y="36" width="520" height="10" fill="#F5F0F8"/>
    <line x1="0" y1="46" x2="520" y2="46" stroke="#E4DCE9" stroke-width="1"/>

    <circle cx="28" cy="23" r="5" fill="#D5CCD9"/>
    <circle cx="44" cy="23" r="5" fill="#D5CCD9"/>
    <circle cx="60" cy="23" r="5" fill="#D5CCD9"/>
    <text x="492" y="27" text-anchor="end" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#756A7D" letter-spacing="1">TROUBLESHOOTING &amp; UX LOOPS</text>

    <!-- Support Ticket Card Left -->
    <g transform="translate(30, 68)">
      <rect x="0" y="0" width="210" height="130" rx="8" fill="#F5F0F8" stroke="#E4DCE9" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="16" y="18" width="80" height="14" rx="4" fill="#211B28"/>
      <rect x="16" y="44" width="160" height="8" rx="4" fill="#D5CCD9"/>
      <rect x="16" y="60" width="140" height="8" rx="4" fill="#D5CCD9"/>
      <rect x="16" y="76" width="110" height="8" rx="4" fill="#D5CCD9"/>
      <rect x="16" y="98" width="60" height="16" rx="999" fill="#E4DCE9"/>
      <text x="46" y="110" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="9" font-weight="600" fill="#756A7D">USER PAIN</text>
    </g>

    <!-- Connecting Arrow Flow -->
    <g transform="translate(254, 122)" stroke="#211B28" stroke-width="2" fill="none">
      <path d="M0 12 L24 12 M16 4 L24 12 L16 20"/>
    </g>

    <!-- UI Resolution Card Right -->
    <g transform="translate(290, 68)">
      <rect x="0" y="0" width="200" height="130" rx="8" fill="#211B28" stroke="#3B3248" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="18" width="70" height="14" rx="4" fill="#F0EDF4"/>
      <rect x="16" y="44" width="150" height="8" rx="4" fill="#6E6277"/>
      <rect x="16" y="60" width="130" height="8" rx="4" fill="#6E6277"/>
      <rect x="16" y="76" width="100" height="8" rx="4" fill="#6E6277"/>
      <rect x="16" y="98" width="70" height="16" rx="999" fill="#450D50"/>
      <text x="51" y="110" text-anchor="middle" font-family="'Rubik', sans-serif" font-size="9" font-weight="600" fill="#D8B5E4">RESOLVED</text>
    </g>

    <!-- Bottom Lesson Quote Banner -->
    <g transform="translate(30, 218)">
      <rect x="0" y="0" width="460" height="66" rx="8" fill="#F0EDF4" stroke="#E4DCE9" stroke-width="1"/>
      <text x="24" y="28" font-family="'Rubik', sans-serif" font-size="11" font-weight="600" fill="#211B28">Core Lesson:</text>
      <text x="24" y="48" font-family="'Rubik', sans-serif" font-size="12" fill="#756A7D">"Antarmuka terbaik adalah yang tidak membingungkan pengguna saat mereka tertekan."</text>
    </g>
  </g>
</svg>
