<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Design — Selenia</title>
  <meta name="description" content="Website eksplorasi desain karakter Selenia berdasarkan rancangan Frame 14 di Figma.">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Local Font: Rubik (Self-hosted) -->
  <link rel="stylesheet" href="../../assets/fonts/rubik.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="site-canvas">

    <!-- ===================================================================
         SECTION 1: HERO IMAGE (1440 × 944 px)
         =================================================================== -->
    <section class="section-hero" id="hero">
      <!-- Navbar / Menu (Figma Node 71:150) -->
      <header class="navbar-frame">
        <div class="navbar-inner">
          <a href="../../index.html" class="brand-logo" aria-label="semenitwasted Home">
            <img src="assets/logo.svg" alt="semenitwasted logo" width="116" height="48">
          </a>
          <nav class="nav-links" aria-label="Main Navigation">
            <a href="#hero" class="nav-link active">Home</a>
            <a href="../../portfolio.html" class="nav-link">Portfolio</a>
            <a href="../../about.html" class="nav-link">About</a>
            <a href="../../contact.html" class="nav-link">Contact</a>
          </nav>
        </div>
      </header>

      <!-- Background Vector Shape (Figma Node 103:2: render bounds 1348 × 920) -->
      <div class="hero-bg-graphic" aria-hidden="true">
        <img src="assets/hero-bg-shape.png" alt="" width="1348" height="920">
      </div>

      <!-- Main Artwork (Figma Node 22:165: render bounds 1040 × 443) -->
      <div class="hero-main-card">
        <img src="assets/hero-character.png" alt="Selenia Hero Character Artwork" width="1040" height="443">
      </div>

      <!-- Modular Pixel Title (Figma Node 22:50: render bounds 502 × 125) -->
      <div class="hero-title-wrap">
        <h1 class="sr-only">Character Design</h1>
        <img src="assets/title-character-design.svg" alt="Character Design" class="pixel-title-img" width="502" height="125">
      </div>

      <!-- Section Divider (Figma Node 22:3) -->
      <div class="section-divider" aria-hidden="true">
        <div class="divider-marquee-track">
          <div class="divider-marquee-inner"></div>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         SECTION 2: SKETS (1440 × 892 px)
         =================================================================== -->
    <section class="section-skets" id="skets">
      <!-- Card Background with Masked Sketch Artwork (Figma Node 103:3: render bounds 1140 × 868) -->
      <div class="skets-card-bg" aria-hidden="true">
        <img src="assets/section2-card-bg.png" alt="" width="1140" height="868">
      </div>

      <!-- Title - Skets (Figma Node 22:274: render bounds 294 × 60) -->
      <div class="skets-title-wrap">
        <h2 class="sr-only">Skets</h2>
        <img src="assets/title-skets.svg" alt="Skets" class="pixel-title-img" width="294" height="60">
      </div>

      <!-- Text Description (Figma Node 22:313: 288 × 187 px) -->
      <p class="skets-text">
        Sketsa dibuat di atas kertas, kemudian dikembangkan menjadi versi digital menggunakan Adobe Illustrator.
      </p>

      <!-- Section Divider (Figma Node 22:222) -->
      <div class="section-divider" aria-hidden="true">
        <div class="divider-marquee-track">
          <div class="divider-marquee-inner"></div>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         SECTION 3: COLOR (1440 × 963 px)
         =================================================================== -->
    <section class="section-color" id="color">
      <!-- Main Tall Character Card (Figma Node 35:510: render bounds 613 × 936) -->
      <div class="color-main-card">
        <img src="assets/color-main-character.png" alt="Warna Karakter Utama" width="613" height="936">
      </div>

      <!-- Color Title (Figma Node 35:577: render bounds 508 × 114) -->
      <div class="color-title-wrap">
        <h2 class="sr-only">Color</h2>
        <img src="assets/title-color.svg" alt="Color" class="pixel-title-img" width="508" height="114">
      </div>

      <!-- Color Variants Collection Card (Figma Node 35:534: render bounds 804 × 734) -->
      <div class="color-variants-card">
        <img src="assets/color-variants.png" alt="Eksplorasi Varian Warna" width="804" height="734">
      </div>

      <!-- Section Divider (Figma Node 35:614) -->
      <div class="section-divider" aria-hidden="true">
        <div class="divider-marquee-track">
          <div class="divider-marquee-inner"></div>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         SECTION 4: LIGHT & SHADOW (1440 × 945 px)
         =================================================================== -->
    <section class="section-light-shadow" id="light-shadow">
      <!-- Title Light (Figma Node 35:1282: render bounds 399 × 92) -->
      <div class="title-light-wrap">
        <h2 class="sr-only">Light</h2>
        <img src="assets/title-light.svg" alt="Light" class="pixel-title-img" width="399" height="92">
      </div>

      <!-- Card Light (Figma Node 35:1365) -->
      <div class="card-light-variants">
        <img src="assets/light-variants.png" alt="Eksplorasi Pencahayaan" width="808" height="558">
      </div>

      <!-- Card Shadow (Figma Node 35:1405) -->
      <div class="card-shadow-variants">
        <img src="assets/shadow-variants.png" alt="Eksplorasi Bayangan" width="808" height="558">
      </div>

      <!-- Title Shadow (Figma Node 35:1312: render bounds 503 × 80) -->
      <div class="title-shadow-wrap">
        <h2 class="sr-only">Shadow</h2>
        <img src="assets/title-shadow.svg" alt="Shadow" class="pixel-title-img" width="503" height="80">
      </div>
    </section>

    <!-- ===================================================================
         SECTION 5: TEXTURE (1440 × 1001 px)
         =================================================================== -->
    <section class="section-texture" id="texture">
      <!-- Texture Collection Card (Figma Node 103:4) -->
      <div class="texture-main-card">
        <img src="assets/texture-collection.png" alt="Eksplorasi Tekstur dan Material" width="1224" height="944">
      </div>

      <!-- Title Texture (Figma Node 35:2535) -->
      <div class="texture-title-wrap">
        <h2 class="sr-only">Texture</h2>
        <img src="assets/title-texture.svg" alt="Texture" class="pixel-title-img" width="496" height="67">
      </div>
    </section>

    <!-- ===================================================================
         SECTION 6: FINISH (1440 × 944 px)
         =================================================================== -->
    <section class="section-finish" id="finish">
      <!-- Card Section Title / Summary (Figma Node 35:2931: render bounds 804 × 390) -->
      <div class="finish-summary-card">
        <img src="assets/finish-card-summary.png" alt="Rangkuman Desain Karakter" width="804" height="390">
      </div>

      <!-- Title Finish (Figma Node 35:3002: render bounds 492 × 202) -->
      <div class="finish-title-wrap">
        <h2 class="sr-only">Finish</h2>
        <img src="assets/title-finish.svg" alt="Finish" class="pixel-title-img" width="492" height="202">
      </div>

      <!-- Final Render Main Artwork (Figma Node 35:2978) -->
      <div class="finish-artwork-card">
        <img src="assets/finish-character.png" alt="Hasil Akhir Karakter Selenia" width="496" height="824">
      </div>
    </section>

  </div>
</body>

</html>
